<style>

const z=d=>d.toISOString().replace(/[-:]|\.\d+/g,'');
const calu=(t,a)=>{const s=when(a);return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t+' '+P.panggilan+' & '+W.panggilan)}&dates=${z(s)}/${z(new Date(+s+36e5*3))}&location=${encodeURIComponent(a.tempat+', '+a.alamat)}`};
const evt=(t,a,ik,an)=>`<div class="fr ev" ${A(an)}>${ic(ik,'big')}<h3>${t}</h3><p class="dt">${tgl(a)}</p><p>${e(a.jam)} ${e(a.zona)}${a.selesai?' - Selesai':''}</p><p><b style="font-weight:500">${e(a.tempat)}</b><br><small style="color:var(--mu)">${e(a.alamat)}</small></p>${a.maps?`<a class="bt" target="_blank" rel="noopener" href="${e(a.maps)}">${ic('pin')}Google Maps</a>`:''}<a class="bt s" target="_blank" rel="noopener" href="${calu(t,a)}">${ic('cal')}Simpan Kalender</a></div>`;
const cp=(p,r,an)=>`<div class="cp"><div class="ov" ${A('zi')}><div style="background-image:${url(r)}" role="img" aria-label="${e(p.nama)}"></div></div><h3 ${A(an)}>${e(p.nama)}</h3><p ${A(an,.15)}>${e(p.anakKe||'')} dari pasangan<br><b>${e(p.ayah)}</b> &amp; <b>${e(p.ibu)}</b><br><small>${e(p.domisili)}</small></p></div>`;
const rk=(D.hadiah.rekening||[]).slice(0,2),kl=D.keluarga&&D.keluarga.aktif?D.keluarga.daftar||[]:[];
const salin=(t,n)=>`<button class="bt" data-cp="${e(n)}">${ic('copy')}${t}</button>`;
const slides=[...new Set([D.foto.cover,...(D.galeri||[])].filter(Boolean))].slice(0,5);
let h=`<section id="home" data-t="Beranda" class="hero"><div class="hs">${slides.map((s,i)=>`<div class="sl${i?'':' on'}" style="background-image:${url(s)};animation-delay:-${i*3}s"></div>`).join('')}<div class="ho"></div><i class="cn a"></i><i class="cn b"></i><i class="cn c"></i><i class="cn d"></i>
<div class="ht"><p class="bs">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</p><div class="lb">Undangan Pernikahan</div><h1 class="script gold">${e(W.panggilan)} &amp; ${e(P.panggilan)}</h1></div>
<div class="hb"><span class="pl2">${tgl(D.akad)}</span><p class="gs">Undangan khusus untuk<b>${e(tamu)}</b></p><span class="sc" aria-hidden="true"></span></div></div></section>`;
if(D.kutipan)h+=`<section id="kutipan" class="alt" data-t="Ayat"><div class="dm" ${A('zi')}><i></i></div><p class="ar" ${A('bl')}>${e(D.kutipan.arab)}</p><p class="arti" ${A('fu',.2)}>"${e(D.kutipan.arti)}"</p><div class="src" ${A('fu',.3)}>${e(D.kutipan.sumber)}</div></section>`;
h+=sec('mempelai','Mempelai','Pasangan Bahagia',`<p ${A('fu')} style="color:var(--mu)">Dengan memohon rahmat dan ridho Allah Subhanahu wa Ta'ala, kami bermaksud menyelenggarakan syukuran pernikahan putra-putri kami:</p>${cp(W,D.foto.mempelaiWanita,'fl')}<div class="amp" ${A('zi')}>&amp;</div>${cp(P,D.foto.mempelaiPria,'fr')}`);
h+=sec('acara','Hari Bahagia','Rangkaian Acara',`<p ${A('fu')} style="color:var(--mu)">Kami bermaksud menyelenggarakan Akad dan Resepsi Pernikahan pada:</p><div class="cd" id="cd" ${A('zi')}></div>${evt('Akad Nikah',D.akad,'ring','fl')}${D.resepsi&&D.resepsi.aktif?evt('Resepsi',D.resepsi,'heart','fr'):''}${D.live?`<a class="bt" target="_blank" rel="noopener" href="${e(D.live)}">${ic('play')}Siaran Langsung</a>`:''}`,1);
if(D.kisah&&D.kisah.length)h+=sec('kisah','Perjalanan','Kisah Cinta',`<div class="tl">${D.kisah.map((k,i)=>`<div ${A(i%2?'fr':'fl')}><div class="y">${e(k.tahun)}</div><h4>${e(k.judul)}</h4><p>${e(k.isi)}</p></div>`).join('')}</div>`);
if(D.galeri&&D.galeri.length)h+=sec('galeri','Momen','Galeri Foto',`<div class="sld" id="sld" ${A('fu')}>${D.galeri.map(g=>`<img loading="lazy" src="${e(g)}" alt="Foto prewedding" onerror="this.style.visibility='hidden'">`).join('')}</div><div class="dots" id="dots"><button class="ar2" id="pv" aria-label="Sebelumnya" style="transform:none">${ic('l')}</button>${D.galeri.map((g,i)=>`<button aria-label="Foto ${i+1}"></button>`).join('')}<button class="ar2" id="nx" aria-label="Berikutnya" style="transform:none">${ic('r')}</button></div>`,1);
if(D.tampil.hadiah&&(rk.length||D.hadiah.alamatKado))h+=sec('hadiah','Tanda Kasih','Kado Digital',`<p ${A('fu')} style="color:var(--mu)">Doa restu Anda merupakan karunia terindah bagi kami. Bagi yang ingin memberikan tanda kasih secara digital:</p>${rk.map((r,i)=>`<div class="gc" ${A(i%2?'fr':'fl')}><div class="chip"></div><div class="jn">${e(r.label)} · ${e(r.jenis)}</div><span class="no">${e(r.nomor)}</span><div class="an">a.n. <b>${e(r.nama)}</b></div>${salin('Salin Nomor',r.nomor)}</div>`).join('')}${D.hadiah.alamatKado?`<div class="gc" ${A('fu')}><div class="jn">Kirim Kado Fisik</div><span class="an" style="display:block;margin-top:8px">Penerima: <b>${e(D.hadiah.penerima||'')}</b><br>${e(D.hadiah.alamatKado)}</span>${salin('Salin Alamat',D.hadiah.alamatKado)}</div>`:''}`);
const fs=(id,ex)=>`<label for="n${id}">Nama</label><input id="n${id}" maxlength="40" required value="${e(Q)}"><label for="s${id}">Konfirmasi Kehadiran</label><select id="s${id}"><option value="hadir">Hadir</option><option value="ragu">Ragu-ragu</option><option value="tidak">Tidak Hadir</option></select>${ex}<div style="text-align:center;margin-top:18px"><button class="bt s">${ic('send')}${id==1?'Konfirmasi':'Kirim Ucapan'}</button></div><div class="st" id="st${id}" role="status"></div>`;
h+=sec('ucapan','Konfirmasi & Doa','Buku Tamu & RSVP',`<p ${A('fu')} style="color:var(--mu)">Kehadiran dan doa restu Anda merupakan kehormatan serta kebahagiaan bagi kami sekeluarga:</p><form id="f1" class="fr" ${A('fl')}><h4>Konfirmasi Kehadiran</h4>${fs(1,'<label for="j1">Jumlah Tamu yang Hadir</label><select id="j1">'+[1,2,3,4].map(i=>`<option value="${i}">${i} Orang</option>`).join('')+'</select>')}</form><form id="f2" class="fr" ${A('fr')}><h4>Ucapan & Doa Restu</h4>${fs(2,'<label for="p2">Ucapan & Doa <small id="ct">(0/300)</small></label><textarea id="p2" maxlength="300" rows="4" required></textarea>')}</form><div id="msgs"></div>`,1);
if(kl.length)h+=sec('turut-mengundang','Segenap Keluarga','Turut Mengundang',`<p ${A('fu')} style="color:var(--mu)">Ungkapan rasa hormat dan terima kasih yang tulus kepada segenap keluarga besar, alim ulama, tokoh masyarakat, dan handai taulan:</p><ol class="kl" ${A('fu',.1)}>${kl.map((k,i)=>`<li${i>=8?' hidden data-x':''}>${e(k)}</li>`).join('')}</ol>${kl.length>8?'<button class="bt" id="more">Lihat Selengkapnya</button>':''}`);
const PN=D.foto.penutup||'';
h+=`<section id="penutup" data-t="Penutup" class="pen">${PN?`<div class="pb" style="background-image:${url(PN)}" role="img" aria-label="Foto penutup"></div><div class="po"></div>`:''}<div class="pc"><div class="ty" ${A('fu')}>Terima Kasih</div><p ${A('fu',.1)}>Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir untuk memberikan doa restu kepada kedua mempelai.</p><p ${A('fu',.2)}>Wassalamu'alaikum Wr. Wb.</p><h2 class="script gold" ${A('bl',.3)}>${e(W.panggilan)} &amp; ${e(P.panggilan)}</h2>${D.demo?'<small style="color:var(--mu)">Data contoh (DEMO)</small>':''}</div></section>`;
$('#app').innerHTML=h+'<nav id="dock" aria-label="Menu"></nav>';
const IC={home:'home',mempelai:'heart',acara:'cal',galeri:'img',hadiah:'gift',ucapan:'msg'},NM={home:'Home',mempelai:'Couple',acara:'Acara',galeri:'Galeri',hadiah:'Kado',ucapan:'RSVP'};
$('#dock').innerHTML=$$('section').filter(s=>IC[s.id]).map(s=>`<a href="#${s.id}" data-s="${s.id}">${ic(IC[s.id])}${NM[s.id]}</a>`).join('');
$('#cn').innerHTML=`${e(W.panggilan)} &amp; ${e(P.panggilan)}`;$('#ctg').textContent=tgl(D.akad);$('#tm').textContent=tamu;$('#cvph').style.backgroundImage=url(D.foto.cover);document.body.style.overflow='hidden';
// sparkles
const spark=(el,n)=>{for(let i=0;i<n;i++){const s=document.createElement('i');s.className='sp';s.style.cssText=`left:${Math.random()*100}%;--z:${2+Math.random()*3}px;--t:${7+Math.random()*7}s;--dl:-${Math.random()*10}s;--x:${(Math.random()*60-30)|0}px`;el.appendChild(s)}};
spark($('#cover .cc').parentNode,16);spark($('#kutipan')||document.body,12);
// buka undangan
const au=$('#au');if(D.musik){au.src=D.musik;$('#mus').hidden=false}
$('#open').onclick=()=>{$('#cover').classList.add('go');document.body.style.overflow='';if(D.musik)au.play().catch(()=>{});setTimeout(()=>$('#cover').classList.add('off'),2000)};
$('#mus').onclick=()=>au.paused?au.play():au.pause();au.onplay=()=>$('#mus').classList.add('play');au.onpause=()=>$('#mus').classList.remove('play');
// reveal + dock aktif
const ob=new IntersectionObserver(a=>a.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');ob.unobserve(x.target)}}),{threshold:.12});$$('[data-a]').forEach(s=>ob.observe(s));
const nv=new IntersectionObserver(a=>a.forEach(x=>{if(x.isIntersecting){const id=x.target.id==='kutipan'?'home':x.target.id;$$('#dock a').forEach(l=>l.classList.toggle('on',l.dataset.s===id))}}),{rootMargin:'-45% 0px -50% 0px'});$$('section').forEach(s=>nv.observe(s));
// slideshow hero
const SL=$$('.sl');if(SL.length>1){let k=0;setInterval(()=>{SL[k].classList.remove('on');k=(k+1)%SL.length;SL[k].classList.add('on')},6000)}
// countdown
const T=when(D.akad);setInterval(function t(){let s=Math.max(0,(T-Date.now())/1000|0);$('#cd').innerHTML=[['Hari',86400],['Jam',3600],['Menit',60],['Detik',1]].map(([l,m])=>{const v=s/m|0;s-=v*m;return `<div><b>${String(v).padStart(2,'0')}</b><small>${l}</small></div>`}).join('');return t}(),1000);
// salin, lightbox, more
$$('[data-cp]').forEach(b=>{const o=b.innerHTML;b.onclick=()=>navigator.clipboard.writeText(b.dataset.cp).then(()=>{b.innerHTML=ic('copy')+'Tersalin';setTimeout(()=>b.innerHTML=o,1800)},()=>b.textContent='Salin manual')});
$('#lb').onclick=()=>$('#lb').style.display='none';
if($('#more'))$('#more').onclick=function(){$$('[data-x]').forEach(l=>l.hidden=false);this.remove()};
// slider galeri
const sld=$('#sld');if(sld){const im=[...sld.querySelectorAll('img')],dt=[...$('#dots').querySelectorAll('button:not(.ar2)')];let cur=0,timer;
const go=i=>{cur=(i+im.length)%im.length;sld.scrollTo({left:im[cur].offsetLeft-(sld.clientWidth-im[cur].clientWidth)/2,behavior:'smooth'})};
const io=new IntersectionObserver(a=>a.forEach(x=>{if(x.isIntersecting){const i=im.indexOf(x.target);im.forEach((m,j)=>m.classList.toggle('act',i===j));dt.forEach((d,j)=>d.classList.toggle('on',i===j));cur=i}}),{root:sld,threshold:.6});im.forEach(m=>io.observe(m));
const play=()=>{clearInterval(timer);timer=setInterval(()=>go(cur+1),3800)};play();
['touchstart','mousedown','wheel'].forEach(v=>sld.addEventListener(v,()=>{clearInterval(timer);setTimeout(play,6000)},{passive:true}));
$('#pv').onclick=()=>{go(cur-1);play()};$('#nx').onclick=()=>{go(cur+1);play()};dt.forEach((d,i)=>d.onclick=()=>{go(i);play()});
im.forEach(m=>m.onclick=()=>{$('#lb img').src=m.src;$('#lb').style.display='flex'});im[0].classList.add('act');dt[0].classList.add('on')}
// RSVP & ucapan
$('#p2').oninput=()=>$('#ct').textContent=`(${$('#p2').value.length}/300)`;
let show=D.tampil.ucapan;
async function muat(){const m=$('#msgs');if(!FB.ok())return;try{const c=await FB.pengaturan();if(c.ucapan!==undefined)show=c.ucapan;if(!show)return;m.innerHTML=(await FB.ucapan()).filter(u=>u.pesan).map(u=>`<div class="m"><span class="av">${e((u.nama||'?').trim().charAt(0).toUpperCase())}</span><div><b>${e(u.nama)}</b> · <small>${u.hadir=='hadir'?'Hadir':u.hadir=='tidak'?'Tidak hadir':'Ragu-ragu'}</small><br>${e(u.pesan)}</div></div>`).join('')}catch(x){m.textContent='Ucapan belum dapat dimuat.'}}muat();
async function kirim(ev,id){ev.preventDefault();const st=$('#st'+id);if(!FB.ok()){st.textContent='Firebase belum dikonfigurasi.';return}st.textContent='Mengirim…';
const hd=$('#s'+id).value;try{await FB.kirim({nama:$('#n'+id).value.trim().slice(0,40),hadir:hd,jumlah:id==1&&hd=='hadir'?+$('#j1').value:0,pesan:id==2?$('#p2').value.trim().slice(0,300):''});st.textContent=id==1?'Konfirmasi terkirim ✓':'Terima kasih, ucapan terkirim ✓';if(id==2){$('#p2').value='';muat()}}catch(x){st.textContent='Gagal mengirim: '+x.message}}
$('#f1').onsubmit=v=>kirim(v,1);$('#f2').onsubmit=v=>kirim(v,2);
</script></body></html>
